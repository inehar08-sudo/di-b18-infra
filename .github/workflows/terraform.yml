name: Terraform CI/CD

on:
  push:
    branches:
      - 'feature/**'
      - main

permissions:
  id-token: write
  contents: read

jobs:

  terraform-plan:
    name: Terraform Plan

    runs-on: ubuntu-latest

    environment:
      name: preprod

    env:
      TF_IN_AUTOMATION: true

    defaults:
      run:
        working-directory: ${{ github.ref == 'refs/heads/main' && 'environment/prod' || 'environment/preprod' }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: "YOUR_APPLICATION_CLIENT_ID"
          tenant-id: "YOUR_TENANT_ID"
          subscription-id: "YOUR_SUBSCRIPTION_ID"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ github.ref == 'refs/heads/main' && 'environment/prod/tfplan' || 'environment/preprod/tfplan' }}


  terraform-apply:
    name: Terraform Apply

    if: github.ref == 'refs/heads/main'

    needs: terraform-plan

    runs-on: ubuntu-latest

    environment:
      name: production

    env:
      TF_IN_AUTOMATION: true

    defaults:
      run:
        working-directory: environment/prod

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: "e9e9a265-3db3-4069-9fd7-a878119fb4c8"
          tenant-id: "8bba23c6-05e0-40e7-b88f-b8e386da422f"
          subscription-id: "3008a893-f5d9-4f23-bca6-0665693b4dc9"

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: environment/prod

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan