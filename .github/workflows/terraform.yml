name: Terraform CI/CD

on:
  push:
    branches:
      - 'feature/**'
      - main

permissions:
  id-token: write
  contents: read

jobs:

  terraform-feature-plan:
    name: Terraform Plan - Feature

    if: startsWith(github.ref, 'refs/heads/feature/')

    runs-on: ubuntu-latest

    environment:
      name: preprod

    env:
      TF_IN_AUTOMATION: true

    defaults:
      run:
        working-directory: environment/preprod

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: "e9e9a265-3db3-4069-9fd7-a878119fb4c8"
          tenant-id: "8bba23c6-05e0-40e7-b88f-b8e386da422f"
          subscription-id: "3008a893-f5d9-4f23-bca6-0665693b4dc9"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format
        run: terraform fmt

      - name: Terraform Plan
        run: terraform plan


  terraform-main:
    name: Terraform Plan and Apply - Main

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: production

    env:
      TF_IN_AUTOMATION: true

    defaults:
      run:
        working-directory: environment/prod

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: "e9e9a265-3db3-4069-9fd7-a878119fb4c8"
          tenant-id: "8bba23c6-05e0-40e7-b88f-b8e386da422f"
          subscription-id: "3008a893-f5d9-4f23-bca6-0665693b4dc9"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format
        run: terraform fmt

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve